instructions:
- Season the {chicken} with salt and pepper. Sear in the {oil} over medium-high heat
  for 2–3 minutes per side until golden, then remove. They don't need to be cooked
  through yet.
- Melt the butter in the same pot. Add the onion, carrots, and celery and cook 5–7 minutes,
  then add the garlic, thyme, and rosemary.
- Sprinkle the flour over the vegetables and stir for 1–2 minutes to make a roux.
- Slowly whisk in the bone broth to prevent lumps. Add the bay leaves and return the
  chicken. Simmer gently until the chicken reaches 165°F inside, 12–20 minutes depending
  on thickness.
- Remove the chicken, shred it into bite-size pieces, and return it to the pot. Lower
  the heat and stir in the milk. Keep at a gentle simmer.
- Mix the biscuit dough as the box directs, using cold water and the cheddar. Keep it
  slightly sticky and don't overmix.
- Drop golf-ball-sized spoonfuls onto the gently bubbling stew, leaving space between
  them. Cover tightly and simmer 15–20 minutes without lifting the lid for the first
  15 minutes, until the dumpling centers are cooked through.
- Let the stew rest uncovered for 5 minutes before serving. Remove the bay leaves.
notes:
- Chicken breasts are lean, so don't let them simmer through the whole dumpling cook.
  Shredding them before the dumplings go on keeps them tender.
- The mix contains leavening and the dumplings expand a lot. Keep the simmer gentle
  and the lid on; they cook by steam.
- The base method brushes the dumplings with butter and the box's garlic-herb packet. That
  was skipped here because the dumplings are already wet from steaming.
- Plain Greek yogurt works stirred into individual bowls, 2–3 tbsp each. Skip sweetened
  coffee creamer as the dairy.
- Bone broth is a brand with 45 kcal and 9 g protein per 8 fl oz, about 45 g protein
  across the pot. Regular chicken stock works but adds much less protein.
- The 4 tbsp of roux butter is assumed to have been used; it wasn't confirmed while
  cooking.
