instructions:
- Finely chop the vegetables. Soften them in oil in a heavy pot, then add turkey and
  cook until browned.
- Toast the spices briefly. If retaining tomato paste, cook it into the mixture without
  scorching.
- Deglaze with Shaoxing wine, scraping the pot. Reduce, then add tomatoes, stock,
  sauces, sugar, and chocolate.
- Simmer gently until thick, stirring as needed. The base recipe suggests about three
  hours; your actual cooking time was not recorded. Adjust seasoning.
